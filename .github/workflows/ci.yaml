name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  biome:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6.0.9
      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: 'Install Packages'
        run: pnpm install --frozen-lockfile
      - name: 'Biome'
        run: pnpm biome ci --reporter github

  typecheck:
    name: 'Typecheck'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6.0.9
      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: 'Install Packages'
        run: pnpm install --frozen-lockfile
      - name: 'tsc'
        run: pnpm run typecheck
      - name: 'tsc (address-book)'
        run: pnpm --filter @beefyfinance/blockchain-addressbook run typecheck

  addresses:
    name: 'Address Checksums'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
        with:
          # need the base commit present locally to diff against it
          fetch-depth: 0
      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6.0.9
      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: 'Install Packages'
        run: pnpm install --frozen-lockfile
      - name: 'Check Changed Files'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: pnpm exec tsx scripts/check-addresses.ts --since="$BASE_SHA" --reporter=github

  build:
    name: 'Test Build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v6.0.9
      - name: 'Setup Node'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: 'Install Packages'
        run: pnpm install --frozen-lockfile
      - name: 'Build Bundle'
        run: pnpm run build
