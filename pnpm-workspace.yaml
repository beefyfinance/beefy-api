packages:
  - '.'
  - 'packages/*'

minimumReleaseAgeExclude:
  - '@beefyfinance/*'
verifyDepsBeforeRun: warn

catalog:
  # --- runtime ---
  '@apollo/client': ^3.14.1
  '@koa/cors': ^3.1.0
  async-lock: ^1.4.1
  bignumber.js: ^11.1.5
  date-fns: ^4.4.0
  escape-string-regexp: ^4.0.0
  graphql: ^15.5.0
  graphql-tag: ^2.12.4
  jsonpath: ^1.1.1
  koa: ^2.13.0
  koa-bodyparser: ^4.3.0
  koa-conditional-get: ^3.0.0
  koa-etag: ^4.0.0
  koa-helmet: ^5.2.0
  koa-router: ^9.4.0
  lodash-es: ^4.18.1
  node-cache: ^5.1.2
  p-queue: ^9.3.1
  pino: ^10.3.1
  redis: ^5.8.2
  viem: 2.55.8

  # --- tooling ---
  '@biomejs/biome': 2.5.5
  lefthook: ^2.1.10
  tsdown: ^0.22.14
  tsx: ^4.23.1
  typescript: 6.0.3

  # --- types + dev ---
  '@types/async-lock': ^1.4.2
  '@types/command-line-args': ^5.2.3
  '@types/jsonpath': ^0.2.4
  '@types/koa': ^2.13.5
  # runtime @koa/cors is 3.x; @types 4.x/5.x track later majors
  '@types/koa__cors': ^3.3.1
  '@types/koa-bodyparser': ^4.3.13
  # no @types major matches koa-conditional-get 3.x; 2.x is the newest published
  '@types/koa-conditional-get': ^2.0.4
  # no @types major matches koa-etag 4.x; 3.x is the newest published
  '@types/koa-etag': ^3.0.4
  # runtime koa-helmet is 5.x; @types 6.x tracks a later major
  '@types/koa-helmet': ^5.2.7
  '@types/lodash-es': ^4.17.12
  '@types/node': ^26.1.1
  # no @types major matches yargs 18.x; 17.x is the newest published
  '@types/yargs': ^17.0.35
  command-line-args: ^5.2.1
  fast-glob: ^3.2.12
  pino-pretty: ^13.1.3
  yargs: ^18.0.0

allowBuilds:
  esbuild: true
  lefthook: true
