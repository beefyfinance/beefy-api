packages:
  - '.'
  - 'packages/*'

minimumReleaseAgeExclude:
  - '@beefyfinance/*'
verifyDepsBeforeRun: warn

catalog:
  # --- runtime ---
  '@apollo/client': ^3.5.6
  '@koa/cors': ^3.1.0
  async-lock: ^1.4.1
  bignumber.js: ^11.1.5
  date-fns: ^4.4.0
  escape-string-regexp: ^4.0.0
  ethers: ^5.7.2
  graphql: ^15.5.0
  graphql-tag: ^2.12.4
  jsonpath: ^1.1.1
  koa: ^2.13.0
  koa-bodyparser: ^4.3.0
  koa-conditional-get: ^3.0.0
  koa-etag: ^4.0.0
  koa-helmet: ^5.2.0
  koa-router: ^9.4.0
  lodash-es: ^4.18.1
  node-cache: ^5.1.2
  p-queue: ^9.3.1
  pino: ^10.3.1
  redis: ^5.8.2
  viem: ^1.20.2

  # --- tooling ---
  '@biomejs/biome': 2.5.5
  lefthook: ^2.1.10
  tsx: ^4.23.1
  typescript: ~5.3.3

  # --- types + dev ---
  '@ethereumjs/util': ^9.0.3
  '@types/async-lock': ^1.4.2
  '@types/koa': ^2.13.5
  '@types/lodash-es': ^4.17.12
  '@types/node': ^26.1.1
  command-line-args: ^5.2.1
  fast-glob: ^3.2.12
  pino-pretty: ^13.1.3
  yargs: ^18.0.0

allowBuilds:
  esbuild: true
  lefthook: true
